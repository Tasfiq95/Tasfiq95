name: Generate GitHub stats images

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate metrics image and commit it to the repo
        uses: lowlighter/metrics@latest
        with:
          filename: generated/metrics.svg
          token: ${{ secrets.ACCESS_TOKEN }}
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
